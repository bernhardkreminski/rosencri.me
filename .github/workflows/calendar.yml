name: Build calendar.ics

on:
  schedule:
    # Hourly, 17 minutes past the hour (offset to avoid the top-of-hour rush).
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'data/seed-events.json'
      - 'scripts/build-ics.mjs'
      - 'assets/js/ical.js'

permissions:
  contents: write

concurrency:
  group: calendar-ics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build calendar.ics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Runners are UTC; seed events use wall-clock times that must be read
          # as Rosenheim-local, or the feed drifts 2h from the website.
          TZ: Europe/Berlin
        run: node scripts/build-ics.mjs

      - name: Commit calendar.ics if it changed
        run: |
          # Use `git status --porcelain` rather than `git diff --quiet` so this
          # also catches the very first run, where calendar.ics is untracked
          # (a plain `git diff` sees no difference for untracked files).
          if [ -z "$(git status --porcelain -- calendar.ics)" ]; then
            echo "calendar.ics unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git commit -m "chore: refresh calendar.ics [skip ci]"
          git push
